  :root{
    --bg:#0a0a0c; --bg2:#050506; --panel:#17171d; --panel2:#232329; --panel3:#2b2b33; --line:#2a2a34; --line2:#35353f;
    --muted:#a3a3ad; --muted2:#75757f; --red:#dc2626; --red-l:#ef4444; --red-dark:#7f1d1d; --red-pale:#fecaca;
    --blue:#2563eb; --blue-l:#3b82f6; --white:#ffffff; --green:#16a34a; --amber:#d97706; --amber-dark:#78350f; --amber-pale:#fde68a;
    --gold:#eab308; --gold-l:#facc15; --gold-dark:#854d0e; --gold-pale:#fef08a;
    --shadow-sm:0 2px 8px rgba(0,0,0,.35); --shadow-md:0 8px 24px rgba(0,0,0,.45); --shadow-gold:0 6px 20px rgba(234,179,8,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{height:100%; margin:0;}
  body{background:radial-gradient(120% 90% at 50% -10%, #1c1c22 0%, var(--bg) 46%, var(--bg2) 100%); color:var(--white); font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-weight:500; overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
  input,textarea,select{user-select:text;}
  *:not(input):not(textarea){user-select:none;}
  #root{height:100vh; height:100dvh; display:flex; flex-direction:column;}
  button{font-family:inherit; border:none; cursor:pointer; color:inherit; background:none;}
  select{font-family:inherit;}
  .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .belt{display:flex; height:6px; width:100%; flex-shrink:0;}
  .belt div{flex:1;}
  .b-y{background:#eab308;} .b-g{background:#22c55e;} .b-b{background:#2563eb;}
  .b-r{background:#dc2626;} .b-k{background:#171717;}
  .col{display:flex; flex-direction:column; height:100%; min-height:0;}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; gap:26px;}
  .eyebrow{font-size:11px; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; text-align:center;}
  .logo-wrap{width:92px; height:92px; margin:0 auto 6px; border-radius:50%; overflow:hidden; box-sizing:border-box; padding:3px;
    background:conic-gradient(from 220deg, var(--gold-dark), var(--gold-l), var(--gold-dark) 70%, var(--gold-dark));
    box-shadow:0 0 0 1px var(--line), var(--shadow-md), var(--shadow-gold);}
  .logo-wrap .ring-inner{width:100%; height:100%; border-radius:50%; overflow:hidden; background:#000; border:2px solid var(--bg);}
  .logo-wrap.sm{width:34px; height:34px; margin:0 auto 6px; box-shadow:0 0 0 1px var(--line), 0 0 0 3px var(--bg), 0 0 0 4px rgba(234,179,8,.5);}
  .logo-wrap img{display:block; width:100%; height:100%; object-fit:cover; transform:scale(1.34);}
  h1{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:900; letter-spacing:-0.02em; text-align:center; margin:10px 0 0; text-transform:uppercase;
    background:linear-gradient(180deg, #fff 0%, #fff 55%, var(--gold-pale) 100%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  h2{text-transform:uppercase; letter-spacing:.02em;}

/* Firebase Realtime Database omite arreglos/objetos vacios y valores null al guardar,
   y ademas convierte en arreglo (con huecos null) cualquier objeto cuyas claves sean
   numeros (ej. {1:.., 2:..} para votos/jueces por id). Al leer, hay que deshacer ambas
   cosas y volver al mismo shape que emptyCategory/newLive esperan, para que el resto
   del codigo -que asume roster/log/pendingVotes/etc. siempre presentes como objeto o
   arreglo "normal"- siga funcionando igual que con window.storage. */
function objFromMaybeArray(v){
  if (Array.isArray(v)){
    const out = {};
    v.forEach((item, i) => { if (item !== null && item !== undefined) out[String(i)] = item; });
    return out;
  }
  return v || {};
}
/* Inverso de objFromMaybeArray: Firebase Realtime Database es inconsistente
   con arreglos dispersos (ej. "slots" de la llave, donde la mayoria de las
   16 casillas son null) - a veces los devuelve como arreglo con huecos, a
   veces como objeto disperso {"0":.., "15":..}. Esto reconstruye siempre un
   arreglo de "length" elementos sin importar cual de las dos formas llego. */
function arrayFromMaybeSparse(v, length){
  const out = new Array(length).fill(null);
  if (Array.isArray(v)){
    for (let i=0;i<Math.min(v.length,length);i++) out[i] = v[i] || null;
  } else if (v && typeof v === 'object'){
    Object.keys(v).forEach(k => { const i = Number(k); if (Number.isInteger(i) && i>=0 && i<length) out[i] = v[k]; });
  }
  return out;
}
function normalizeLive(live){
  if (!live) return live;
  const perJudgeDefault = {1:{red:0,blue:0},2:{red:0,blue:0},3:{red:0,blue:0},4:{red:0,blue:0}};
  return {
    ...live,
    pendingVotes: objFromMaybeArray(live.pendingVotes),
    perJudge: {...perJudgeDefault, ...objFromMaybeArray(live.perJudge)},
    log: live.log || [],
  };
}
function normalizeCategory(cat){
  return {
    ...cat,
    roster: cat.roster || [],
    slots: arrayFromMaybeSparse(cat.slots, 16),
    results: cat.results || {},
    log: cat.log || [],
    live: cat.live ? normalizeLive(cat.live) : null,
  };
}
function normalizeTorneo(data){
  if (!data) return emptyTorneo();
  const categories = {};
  Object.keys(data.categories || {}).forEach(id => { categories[id] = normalizeCategory(data.categories[id]); });

}

}

/* ------------------------- logica de marcador en vivo ------------------------- */
function pushLiveLog(live, text){
  const log = [{ts:Date.now(), text}, ...(live.log||[])].slice(0,30);
  return {...live, log};
}
function resolvePF(live){
  const votes = live.pendingVotes || {};
  const ids = Object.keys(votes);
  if (ids.length === 0) return live;
  const oldest = Math.min(...ids.map(id=>votes[id].ts));
  const windowOpen = Date.now() - oldest < CALL_WINDOW_MS;
  const allVoted = ids.length >= live.numJudges;
  if (windowOpen && !allVoted) return live;
  let red=0, blue=0;
  ids.forEach(id => votes[id].color==='red' ? red++ : blue++);
  let next = {...live, pendingVotes:{}};
  if (red===blue && red>=1){
    next = {...next, scoreRed: next.scoreRed+1, scoreBlue: next.scoreBlue+1};
    next = pushLiveLog(next, `Punto compartido (${red}-${blue} jueces) - anotan ambos`);
  } else if (red>blue && red>=2){
    next = {...next, scoreRed: next.scoreRed+1};
    next = pushLiveLog(next, `Punto Rojo (mayoria ${red}-${blue})`);
  } else if (blue>red && blue>=2){
    next = {...next, scoreBlue: next.scoreBlue+1};
    next = pushLiveLog(next, `Punto Azul (mayoria ${blue}-${red})`);
  } else {
    next = pushLiveLog(next, `Llamada sin mayoria (${red}-${blue}) - sin punto`);
  }
  return next;
}
function applyVote(live, color, judgeId){
  if (live.mode === 'PF'){
    const pendingVotes = {...(live.pendingVotes||{}), [judgeId]:{color, ts:Date.now()}};
    return resolvePF({...live, pendingVotes});
  }
  const pj = {...live.perJudge};
  pj[judgeId] = {...pj[judgeId], [color]: (pj[judgeId] && pj[judgeId][color] || 0)+1};
  const scoreRed = Object.values(pj).reduce((a,j)=>a+(j.red||0),0);
  const scoreBlue = Object.values(pj).reduce((a,j)=>a+(j.blue||0),0);
  return pushLiveLog({...live, perJudge:pj, scoreRed, scoreBlue}, `Juez ${judgeId}: +1 ${color==='red'?'Rojo':'Azul'}`);
}
function getRemainingMs(live){
  if (!live) return 0;
  if (live.timerRunning) return Math.max(0,(live.timerEndsAt||0)-Date.now());
  return live.timerRemainingMs || 0;
}
function fmtTime(ms){
  const total = Math.ceil(ms/1000);
  const m = Math.floor(total/60), s = total%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
/* Anillo de progreso del cronometro de Jefe de Mesa: radio 58 (coincide con
   el viewBox 132x132 del svg en el markup), se recalcula en cada render y
   tambien en el tick liviano de 300ms (ver renderOrTick) para que gire en
   vivo sin reconstruir toda la pantalla. */
const TIMER_RING_R = 58;
const TIMER_RING_C = 2 * Math.PI * TIMER_RING_R;
function timerRingAttrs(remainingMs, phaseMaxMs){
  const pct = phaseMaxMs>0 ? Math.max(0, Math.min(1, remainingMs / phaseMaxMs)) : 0;
  return { circumference: TIMER_RING_C.toFixed(1), offset: (TIMER_RING_C * (1-pct)).toFixed(1) };
}

    perJudge:{1:{red:0,blue:0},2:{red:0,blue:0},3:{red:0,blue:0},4:{red:0,blue:0}},
    pendingVotes:{}, log:[],
    roundDuration: cat.roundDuration || 90, timerRunning:false, timerEndsAt:null,
    timerRemainingMs: (cat.roundDuration||90)*1000, warned10:false,
  };
}

/* ------------------------------ llave / bracket ------------------------------ */
function isResolved(m){ return m.status==='done' || m.status==='bye' || m.status==='empty'; }
function leafMatch(cat, id, fA, fB){
  if (!cat.bracketClosed) return {id, A:fA||null, B:fB||null, status:'empty', winner:null, loser:null};
  if (fA && fB){
    const r = (cat.results||{})[id];
    if (r){
      const winner = r.winner==='A'?fA:fB, loser = r.winner==='A'?fB:fA;
      return {id, A:fA, B:fB, status:'done', winner, loser, winnerSide:r.winner, scoreA:r.scoreA, scoreB:r.scoreB, manual:r.manual, disq:r.disq};
    }
    if (cat.live && cat.live.matchId===id) return {id, A:fA, B:fB, status:'live', winner:null, loser:null};
    return {id, A:fA, B:fB, status:'pending', winner:null, loser:null};
  }
  if (fA && !fB) return {id, A:fA, B:null, status:'bye', winner:fA, loser:null};
  if (!fA && fB) return {id, A:null, B:fB, status:'bye', winner:fB, loser:null};
  return {id, A:null, B:null, status:'empty', winner:null, loser:null};
}
function nextRoundMatch(cat, id, m1, m2){
  if (!isResolved(m1) || !isResolved(m2)) return {id, A:null, B:null, status:'waiting', winner:null, loser:null};
  return leafMatch(cat, id, m1.winner, m2.winner);
}
function buildBracket(cat){
  const slots = cat.slots && cat.slots.length ? cat.slots : new Array(16).fill(null);
  const r16 = []; for (let k=0;k<8;k++) r16.push(leafMatch(cat, `R16-${k+1}`, slots[2*k]||null, slots[2*k+1]||null));
  const qf = [];  for (let k=0;k<4;k++) qf.push(nextRoundMatch(cat, `QF-${k+1}`, r16[2*k], r16[2*k+1]));
  const sf = [];  for (let k=0;k<2;k++) sf.push(nextRoundMatch(cat, `SF-${k+1}`, qf[2*k], qf[2*k+1]));
  const final = nextRoundMatch(cat, 'F-1', sf[0], sf[1]);
  const bothSemisDone = sf[0].status==='done' && sf[1].status==='done';
  const third = bothSemisDone ? leafMatch(cat, 'TP-1', sf[0].loser, sf[1].loser) : {id:'TP-1', A:null, B:null, status:'waiting', winner:null, loser:null};
  return [
    {name:'Octavos', matches:r16},
    {name:'Cuartos', matches:qf},
    {name:'Semis', matches:sf},
    {name:'3\u00b0 y 4\u00b0 puesto', matches:[third]},
    {name:'Final', matches:[final]},
  ];
}
function findMatch(cat, matchId){
  const rounds = buildBracket(cat);
  for (const r of rounds) for (const m of r.matches) if (m.id===matchId) return m;
  return null;
}
function getPodium(cat){
  const rounds = buildBracket(cat);
  const final = rounds.find(r=>r.name==='Final').matches[0];
  const third = rounds.find(r=>r.name==='3° y 4° puesto').matches[0];
  const finalDone = final.status==='done' || final.status==='bye';
  const thirdDone = third.status==='done' || third.status==='bye';
  return {
    first: finalDone ? final.winner : null,
    second: finalDone ? final.loser : null,
    third: thirdDone ? third.winner : null,
    fourth: thirdDone ? third.loser : null,
  };
}

   para no confiar en una lectura completa de /torneo.json que llegue muy
   pegada a una escritura propia: Firebase a veces tarda una fraccion de
   segundo en que una lectura del documento padre refleje una escritura que
   se acaba de hacer en un nodo hijo (PUT en /torneo/categories/{id}.json),
   y sin este margen esa lectura vieja pisaba en silencio un punto recien
   cargado si el Jefe de Mesa tocaba +1 dos veces rapido. */
let lastLocalWriteAt = 0;
const LOCAL_WRITE_GRACE_MS = 1500;
const root = document.getElementById('root');

function saveSession(next){ try{ localStorage.setItem('wako_session', JSON.stringify(next)); }catch(e){} }
function restoreSession(){
  try{
    const s = localStorage.getItem('wako_session');
    if (s){
      const p = JSON.parse(s);
      if (p.view) state.view = p.view;
      if (p.catId) state.catId = p.catId;
      if (p.judgeId) state.judgeId = p.judgeId;
    }
  }catch(e){}
  state.loading = false;
}
async function loadTorneo(){
  const seqAtStart = writeSeq;
  try{
    const res = await fetch(TORNEO_PATH);
    const data = await res.json();
    /* Si este dispositivo escribio algo mientras esta lectura estaba en camino,
       los datos que llegaron son mas viejos que lo que ya tenemos en pantalla
       (ej. un combate que se acaba de cerrar) - se descartan para no "revivir"
       un combate ya terminado ni pisar la ultima accion del usuario. */
    if (writeSeq !== seqAtStart || Date.now() - lastLocalWriteAt < LOCAL_WRITE_GRACE_MS) return;
    state.torneo = normalizeTorneo(data);
  }catch(e){ if (!state.torneo) state.torneo = emptyTorneo(); }
  renderOrTick();
}
/* Escribe SOLO la categoria que cambio (path propio en Firebase), no el documento
   completo. Con un solo tatami esto no se notaba, pero con varios tatamis y jueces
   escribiendo al mismo tiempo, sobreescribir /torneo.json entero cada vez hace que
   la ULTIMA escritura gane y borre en silencio cambios de otras categorias/tatamis
   hechos un instante antes por otro dispositivo. Escribir por categoria evita ese
   choque entre tatamis distintos (cada uno vive en su propio nodo). */
async function putCategory(catId, catData){
  state.torneo = {...state.torneo, categories:{...state.torneo.categories, [catId]: catData}};
  writeSeq++;
  lastLocalWriteAt = Date.now();
  render();
  try{ await fetch(FIREBASE_URL + '/torneo/categories/' + catId + '.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(catData)}); }catch(e){}
}
async function deleteCategoryRemote(catId){
  const cats = {...state.torneo.categories}; delete cats[catId];
  state.torneo = {...state.torneo, categories:cats};
  writeSeq++;
  lastLocalWriteAt = Date.now();
  render();
  try{ await fetch(FIREBASE_URL + '/torneo/categories/' + catId + '.json', {method:'DELETE'}); }catch(e){}
}
/* PIN opcional para las acciones delicadas (declarar ganador manual, reabrir
   llave, eliminar categoria, y el rol completo de Jefe de Mesa) - protege
   contra que alguien altere resultados ya decididos. Inscribir luchadores,
   crear categorias y votar como juez quedan siempre libres, sin PIN.
   Si el organizador no configura PIN, todo sigue abierto como antes. */
async function putPin(pin){
  state.torneo = {...state.torneo, pin};
  writeSeq++;
  lastLocalWriteAt = Date.now();
  render();
  try{ await fetch(FIREBASE_URL + '/torneo/pin.json', {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(pin)}); }catch(e){}
}
function checkPin(){
  const pin = state.torneo && state.torneo.pin;
  if (!pin) return true;
  if (state.pinOk) return true;
  try{ if (localStorage.getItem('wako_pin_ok_' + pin) === '1'){ state.pinOk = true; return true; } }catch(e){}
  const entered = prompt('PIN de mesa / jefe de mesa:');
  if (entered === null) return false;
  if (entered === pin){
    state.pinOk = true;
    try{ localStorage.setItem('wako_pin_ok_' + pin, '1'); }catch(e){}
    return true;
  }
  alert('PIN incorrecto.');
  return false;
}
/* Respaldo descargable de todo el torneo (categorias, inscritos, llaves y
   resultados) - por si se necesita borrar Firebase para el proximo torneo,
   esto queda guardado en el celular/computador de quien lo descargue. */
function descargarRespaldo(){
  const data = JSON.stringify(state.torneo, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url; a.download = `torneo-wako-respaldo-${ts}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function configurarPin(){
  const actual = state.torneo && state.torneo.pin;
  const nuevo = prompt(actual ? 'Cambiar PIN (dejar vacío para quitar la protección):' : 'Crear un PIN para Jefe de Mesa y acciones delicadas (dejar vacío para no usar PIN):', actual||'');
  if (nuevo === null) return;
  const clean = nuevo.trim();
  putPin(clean || null);
  if (clean){ state.pinOk = true; try{ localStorage.setItem('wako_pin_ok_' + clean, '1'); }catch(e){} }
  render();
}
function currentCat(){ return state.torneo && state.catId ? state.torneo.categories[state.catId] : null; }
function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function clearTimers(){
  if (pollTimer) clearInterval(pollTimer);
  if (tickTimer) clearInterval(tickTimer);
  if (resolveTimer) clearInterval(resolveTimer);
  if (stopwatchTimer) clearInterval(stopwatchTimer);
  pollTimer = tickTimer = resolveTimer = stopwatchTimer = null;
}
function setupTimersForView(){
  clearTimers();
  if (state.view === 'stopwatch'){
    stopwatchTimer = setInterval(stopwatchTick, 250);
    return;
  }
  if (state.view !== 'home' && state.view !== 'mesa_newCategory'){
    loadTorneo();
    pollTimer = setInterval(loadTorneo, POLL_MS);
  }
  if (['judge_vote','display_view','jefe_control'].includes(state.view)){
    /* En Jefe de Mesa este tick solo debe refrescar el numero del cronometro,
       NO reconstruir toda la pantalla: si se reconstruye 3 veces por segundo,
       un toque en "+1 punto" puede caer justo cuando el boton viejo desaparece
       y el nuevo todavia no existe, y el punto no se carga - obligando a tocar
       dos veces. Actualizar solo el texto del cronometro evita ese choque. */
    tickTimer = setInterval(()=>{ renderOrTick(); checkTimeExpiry(); }, 300);
    resolveTimer = setInterval(async ()=>{
      const seqAtStart = writeSeq;
      try{
        const res = await fetch(TORNEO_PATH);
        const data = await res.json();
        if (!data || writeSeq !== seqAtStart) return;
        const t = normalizeTorneo(data);
        const cat = t.categories[state.catId];
        if (cat && cat.live && cat.live.mode==='PF' && Object.keys(cat.live.pendingVotes||{}).length>0){
          const resolvedLive = resolvePF(cat.live);
          if (resolvedLive !== cat.live){
            await putCategory(cat.id, {...cat, live:resolvedLive});
          }
        }
      }catch(e){}
    }, 500);
  }
}
function goTo(view, extra){
  if ((view==='jefe_selectCategory' || view==='jefe_control') && !checkPin()) return;
  state.view = view;
  if (extra) Object.assign(state, extra);
  saveSession({view:state.view, catId:state.catId, judgeId:state.judgeId});
  setupTimersForView();
  render();
}
function goHome(){ state.catId=null; state.judgeId=null; goTo('home'); }

/* ------------------------------- acciones mesa ------------------------------- */
/* "Combate rapido": arma en un solo paso una categoria minima (2 esquinas
   genericas, sin division/peso real) y la deja EN VIVO lista para anotar -
   para cuando solo se quiere probar o entrenar sin pasar por inscribir
   luchadores y cerrar llave cada vez. Reusa toda la logica ya probada
   (categoria/llave/combate en vivo), no duplica nada nuevo. */
function startQuickMatch(modalidad){
  const id = uid('cat');
  const cat = emptyCategory(id, {...newCatForm, modalidad, nombre:'Combate rápido', divisionEdad:newCatForm.divisionEdad||'S'});
  cat.roster = [{name:'Rojo', club:'', pesado:false}, {name:'Azul', club:'', pesado:false}];
  putCategory(id, cat);
  closeBracket(id);
  const c = state.torneo.categories[id];
  const rounds = buildBracket(c);
  const match = rounds.flatMap(r=>r.matches).find(m=>m.A && m.B && !m.winner);
  if (!match) return;
  startLive(id, match.id);
  goTo('jefe_control', {catId:id});
}
function createCategory(){
  const id = uid('cat');
  const cat = emptyCategory(id, newCatForm);
  /* Solo se resetean nombre/division/peso, que casi siempre cambian de una
     categoria a otra. Modalidad, sexo, cinturon, jueces, asaltos y duracion
     quedan tal cual quedaron, porque la mesa suele crear varias categorias
     seguidas con el mismo formato (ej. todas Point Fighting, 3 jueces) y
     tener que re-elegir eso cada vez era friccion innecesaria. */
  Object.assign(newCatForm, { nombre:'', divisionEdad:'', peso:'' });
  putCategory(id, cat);
  goTo('mesa_category', {catId:id});
}
function deleteCategory(catId){
  if (!checkPin()) return;
  if (!confirm('\u00bfEliminar esta categor\u00eda y toda su llave? Esta acci\u00f3n no se puede deshacer.')) return;
  deleteCategoryRemote(catId);
  goTo('mesa_home');
}
function addFighter(catId){
  const cat = state.torneo.categories[catId];
  if (!cat || cat.roster.length>=16) return;
  const name = (fighterForm.name||'').trim();
  if (!name) return;
  const fighter = {name, club:(fighterForm.club||'').trim(), pesado:false};
  let next = {...cat, roster:[...cat.roster, fighter]};
  next = pushCatLog(next, `Inscrito: ${name}`);
  fighterForm.name=''; fighterForm.club='';
  putCategory(catId, next);
}
function togglePesado(catId, idx){
  const cat = state.torneo.categories[catId];
  const roster = cat.roster.map((f,i)=> i===idx ? {...f, pesado: !f.pesado} : f);
  putCategory(catId, {...cat, roster});
}
function removeFighter(catId, idx){
  const cat = state.torneo.categories[catId];
  const removedName = cat.roster[idx] ? cat.roster[idx].name : '';
  const roster = cat.roster.filter((_,i)=>i!==idx);
  putCategory(catId, pushCatLog({...cat, roster}, `Se quito a ${removedName} de inscritos`));
}
function shuffleRoster(catId){
  const cat = state.torneo.categories[catId];
  const arr = [...cat.roster];
  for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
  putCategory(catId, {...cat, roster:arr});
}
/* Orden estandar de siembra de llave (16 casillas): al llenar las casillas
   en este orden en vez de secuencial, los luchadores y los "bye" quedan
   repartidos parejo por TODA la llave en vez de amontonarse en las primeras
   casillas. Con el llenado secuencial anterior, con menos de 16 inscritos
   toda la mitad inferior quedaba vacia y la Final terminaba siendo casi
   automatica para quien ganara la mitad superior - este orden lo evita. */
const BRACKET_SEED_ORDER = [0,15,7,8,3,12,4,11,1,14,6,9,2,13,5,10];
function closeBracket(catId){
  const cat = state.torneo.categories[catId];
  if (cat.roster.length < 2) return;
  const shuffled = [...cat.roster];
  for (let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=tmp; }
  const slots = new Array(16).fill(null);
  shuffled.forEach((f,i)=>{ slots[BRACKET_SEED_ORDER[i]]=f; });
  let next = {...cat, slots, bracketClosed:true};
  next = pushCatLog(next, `Llave generada con ${cat.roster.length} luchador(es)`);
  putCategory(catId, next);
}
function reopenBracket(catId){
  if (!checkPin()) return;
  const cat = state.torneo.categories[catId];
  if (Object.keys(cat.results||{}).length>0){ alert('No se puede reabrir: ya hay resultados registrados en esta llave.'); return; }
  const roster = (cat.slots||[]).filter(Boolean);
  putCategory(catId, {...cat, roster, slots:[], bracketClosed:false});
}
function declareWinner(catId, matchId, side){
  if (!checkPin()) return;
  const cat = state.torneo.categories[catId];
  const m = findMatch(cat, matchId);
  if (!m || !m.A || !m.B) return;
  const winnerName = side==='A' ? m.A.name : m.B.name;
  let next = {...cat, results:{...cat.results, [matchId]:{winner:side, scoreA:null, scoreB:null, manual:true}}};
  next = pushCatLog(next, `${matchId}: ${winnerName} avanza (decisión manual)`);
  putCategory(catId, next);
}
function startLive(catId, matchId){
  const cat = state.torneo.categories[catId];
  const m = findMatch(cat, matchId);
  if (!m || !m.A || !m.B) return;
  const live = newLive(cat, matchId, m.A, m.B);
  putCategory(catId, {...cat, live});
}
function finalizeLive(catId, forcedWinner, reason){
  const cat = state.torneo.categories[catId];
  const live = cat.live;
  if (!live) return;
  let winnerSide = forcedWinner;
  if (!winnerSide){
    if (live.scoreRed === live.scoreBlue) return;
    winnerSide = live.scoreRed > live.scoreBlue ? 'A' : 'B';
  }
  const winnerName = winnerSide==='A' ? live.fighterA.name : live.fighterB.name;
  const loserName = winnerSide==='A' ? live.fighterB.name : live.fighterA.name;
  let next = {...cat, live:null, results:{...cat.results, [live.matchId]:{winner:winnerSide, scoreA:live.scoreRed, scoreB:live.scoreBlue, manual:!!reason, disq:reason==='DISQ'}}};
  next.lastWinner = {
    matchId: live.matchId, winnerName, winnerClub: (winnerSide==='A'?live.fighterA:live.fighterB).club||'',
    loserName, loserClub: (winnerSide==='A'?live.fighterB:live.fighterA).club||'',
    scoreA: live.scoreRed, scoreB: live.scoreBlue, disq: reason==='DISQ',
  };
  next = pushCatLog(next, reason==='DISQ' ? `${live.matchId}: ${winnerName} gana por descalificación` : `${live.matchId}: ${winnerName} gana ${live.scoreRed}-${live.scoreBlue}`);
  putCategory(catId, next);
}
function clearLastWinner(catId){
  const cat = state.torneo.categories[catId]; if (!cat) return;
  putCategory(catId, {...cat, lastWinner:null});
}

/* ------------------------------- acciones juez ------------------------------- */
function joinAsJudge(id){
  saveSession({view:'judge_vote', catId:state.catId, judgeId:id});
  goTo('judge_vote', {judgeId:id});
}
function vote(color){
  vibrate(30);
  state.flash = color;
  setTimeout(()=>{ state.flash=''; render(); }, 300);
  const cat = currentCat();
  if (!cat || !cat.live) return;
  const catId = cat.id;
  const optimisticLive = applyVote(cat.live, color, state.judgeId);
  state.torneo = {...state.torneo, categories:{...state.torneo.categories, [catId]: {...cat, live:optimisticLive}}};
  writeSeq++;
  lastLocalWriteAt = Date.now();
  render();
  const seqAtStart = writeSeq;
  /* Ademas del optimismo local, esta funcion vuelve a leer el nodo de ESTA
     categoria (ya no todo el documento /torneo.json, que era una escritura
     mas ancha de lo necesario y quedaba fuera de las reglas de Firebase
     restringidas por categoria) antes de escribir: con varios jueces
     votando casi al mismo tiempo en el mismo combate, dos votos que llegan
     juntos podrian pisarse si cada uno escribe solo sobre lo que tenia en
     su propia pantalla en vez de sobre el ultimo estado real. */
  (async ()=>{
    try{
      const res = await fetch(FIREBASE_URL + '/torneo/categories/' + catId + '.json');
      const data = await res.json();
      const c = data ? normalizeCategory(data) : state.torneo.categories[catId];
      if (!c || !c.live) return;
      const next = applyVote(c.live, color, state.judgeId);
      if (writeSeq !== seqAtStart) return;
      putCategory(catId, {...c, live: next});
    }catch(e){}
  })();
}

/* ------------------------------- acciones jefe de mesa ------------------------------- */
function jefeUpdate(mutator){
  const cat = currentCat(); if (!cat || !cat.live) return;
  const live = mutator({...cat.live});
  putCategory(cat.id, {...cat, live});
}
/* En Point Fighting los 3 jueces señalan en el tatami (según reglamento) y es el
   Jefe de Mesa quien carga el punto aquí - no hay voto por celular. En modalidades
   continuas (LC/KL) cada juez ya suma su propio marcador (ver applyVote), y esto
   queda ademas como correccion manual de mesa por si hay un error. */
function adjustScore(color, delta){
  const cat = currentCat(); if (!cat || !cat.live) return;
  const field = color==='red' ? 'scoreRed' : 'scoreBlue';
  const label = color==='red' ? 'Rojo' : 'Azul';
  const val = Math.max(0, (cat.live[field]||0) + delta);
  const live = pushLiveLog({...cat.live, [field]: val}, `${delta>0?'+1':'-1'} ${label} (mesa)`);
  putCategory(cat.id, {...cat, live});
  /* Muerte subita (Art. 6.2 Point Fighting): en tiempo extra, el primer punto que
     desempata gana el combate de inmediato. */
  if (live.suddenDeath && delta>0 && live.scoreRed !== live.scoreBlue){
    finalizeLive(cat.id, live.scoreRed>live.scoreBlue?'A':'B');
  }
}
/* Cierre de combate según el tiempo se agota en el último asalto (reglamento WAKO):
   - Point Fighting (Art. 6.2): gana quien tenga más puntos; si hay empate, 1 minuto
     extra y luego "muerte subita" (el primer punto que se anota gana).
   - Light Contact / Kick Light (Art. 6.4): gana quien tenga más puntos; si hay empate
     total, el reglamento pide que los jueces decidan por criterio (más activo, más
     patadas, mejor defensa/técnica) - eso no se puede automatizar, queda para que la
     mesa lo resuelva con el botón de asignación manual. */
function autoFinalizeLive(catId){
  const cat = state.torneo.categories[catId];
  const live = cat && cat.live; if (!live) return;
  if (live.scoreRed !== live.scoreBlue){
    finalizeLive(catId, live.scoreRed>live.scoreBlue?'A':'B');
    return;
  }
  if (live.mode === 'PF' && !live.suddenDeath){
    jefeUpdate(l => pushLiveLog({...l, timerRunning:false, timerEndsAt:null, timerRemainingMs:60000, suddenDeath:true}, 'Empate - tiempo extra de 1 min, gana el primer punto (muerte súbita)'));
    return;
  }
  if (live.mode !== 'PF' && !live.tiedFinal){
    jefeUpdate(l => pushLiveLog({...l, timerRunning:false, tiedFinal:true}, 'Empate total - definan ganador según criterio de jueces (más activo, más patadas, mejor defensa/técnica)'));
  }
}
function checkTimeExpiry(){
  if (state.view !== 'jefe_control') return;
  const cat = currentCat();
  if (!cat || !cat.live || !cat.live.timerRunning) return;
  const remaining = getRemainingMs(cat.live);
  /* Aviso a los 10 segundos (pedido explicito, igual que en el cronometro
     suelto): se guarda un flag en el combate en vivo para que solo suene
     una vez por asalto, no en cada tick de 300ms. */
  if (remaining > 0 && remaining <= 10000){
    if (!cat.live.warned10){
      jefeUpdate(live => ({...live, warned10:true}));
      playWarningBeep();
    }
    return;
  }
  if (remaining > 0) return;
  if (cat.live.round >= cat.live.roundsTotal){
    playBell(); setTimeout(playBell, 550);
    autoFinalizeLive(cat.id);
  } else {
    playBell();
    jefeUpdate(live => ({...live, timerRunning:false, timerRemainingMs:0}));
  }
}
function startTimer(){
  const cat = currentCat();
  if (cat && cat.live && !cat.live.timerRunning && getRemainingMs(cat.live) === cat.live.roundDuration*1000){
    playBell();
  }
  jefeUpdate(live=>{ if (live.timerRunning) return live; const remaining=getRemainingMs(live); return {...live, timerRunning:true, timerEndsAt:Date.now()+remaining}; });
}
function pauseTimer(){ jefeUpdate(live=>{ if (!live.timerRunning) return live; const remaining=getRemainingMs(live); return {...live, timerRunning:false, timerRemainingMs:remaining}; }); }
function resetTimer(){ jefeUpdate(live=>({...live, timerRunning:false, timerRemainingMs:live.roundDuration*1000, timerEndsAt:null, warned10:false})); }
function adjustTime(deltaSec){
  jefeUpdate(live=>{
    if (live.timerRunning){
      const newEnds = (live.timerEndsAt||Date.now()) + deltaSec*1000;
      return {...live, timerEndsAt: Math.max(Date.now(), newEnds)};
    }
    const newRemaining = Math.max(0, (live.timerRemainingMs||0) + deltaSec*1000);
    return {...live, timerRemainingMs:newRemaining};
  });
}
function nextRound(){
  jefeUpdate(live=>{
    if (live.round >= live.roundsTotal) return live;
    let next = {...live, round: live.round+1, timerRunning:false, timerEndsAt:null, timerRemainingMs: live.roundDuration*1000, warned10:false};
    next = pushLiveLog(next, `Fin del asalto ${live.round} - inicia asalto ${live.round+1} (marcador se mantiene)`);
    return next;
  });
}
/* ---------------------------- cronometro suelto ---------------------------- */
function ensureAudio(){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}
function playTone(freq, dur, delay, vol){
  if (!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime + (delay||0);
    gain.gain.setValueAtTime(vol||0.35, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+dur);
    osc.start(t);
    osc.stop(t+dur+0.03);
  }catch(e){}
}
/* Campana de asalto: suena al empezar y al terminar cada asalto (como una
   campana de boxeo real - la misma campana marca inicio y fin). */
function playBell(){ ensureAudio(); playTone(587,0.15,0,0.4); playTone(587,0.6,0.05,0.35); }
/* Timbre extra que se suma a la campana SOLO al entrar a descanso, para que
   se distinga por oido de un simple fin/inicio de asalto - el usuario pidio
   explicitamente poder diferenciar "termino el asalto" de "ahora es descanso". */
function playRestChime(){ ensureAudio(); playTone(784,0.15,0,0.3); playTone(988,0.25,0.18,0.3); }
/* Aviso corto cuando quedan 10 segundos de un asalto (pedido explicito). */
function playWarningBeep(){ ensureAudio(); playTone(1046,0.12,0,0.3); }
function getStopwatchRemaining(){
  if (timerState.phase==='setup') return timerCfg.roundSec*1000;
  if (timerState.phase==='done') return 0;
  if (timerState.running) return Math.max(0, timerState.endsAt - Date.now());
  return timerState.remainingMs;
}
function stopwatchTick(){
  const t = timerState;
  if (t.phase==='setup' || t.phase==='done' || !t.running) return;
  const remaining = Math.max(0, t.endsAt - Date.now());
  if (t.phase==='round' && !t.warned10 && remaining<=10000 && remaining>0){
    t.warned10 = true;
    playWarningBeep();
  }
  if (remaining > 0){
    const el = document.querySelector('.swdisplay .t');
    if (el) el.textContent = fmtTime(remaining);
    return;
  }
  advanceStopwatchPhase();
}
function advanceStopwatchPhase(){
  const t = timerState;
  if (t.phase==='round'){
    if (t.round >= timerCfg.rounds){
      timerState = {...t, phase:'done', running:false, remainingMs:0, endsAt:null};
      playBell(); setTimeout(playBell, 550);
    } else {
      timerState = {...t, phase:'rest', remainingMs:timerCfg.restSec*1000, endsAt:Date.now()+timerCfg.restSec*1000, warned10:false};
      playBell(); setTimeout(playRestChime, 450);
    }
  } else if (t.phase==='rest'){
    timerState = {...t, phase:'round', round:t.round+1, remainingMs:timerCfg.roundSec*1000, endsAt:Date.now()+timerCfg.roundSec*1000, warned10:false};
    playBell();
  }
  render();
}
function startStopwatch(){
  ensureAudio();
  const t = timerState;
  if (t.phase==='setup' || t.phase==='done'){
    timerState = {phase:'round', round:1, running:true, remainingMs:timerCfg.roundSec*1000, endsAt:Date.now()+timerCfg.roundSec*1000, warned10:false};
    playBell();
  } else if (!t.running){
    timerState = {...t, running:true, endsAt:Date.now()+t.remainingMs};
  }
  render();
}
function pauseStopwatch(){
  const t = timerState;
  if (!t.running) return;
  timerState = {...t, running:false, remainingMs:Math.max(0, t.endsAt-Date.now())};
  render();
}
function resetStopwatch(){
  timerState = {phase:'setup', round:1, running:false, remainingMs:0, endsAt:null, warned10:false};
  render();
}
function skipStopwatchPhase(){
  if (timerState.phase==='setup' || timerState.phase==='done') return;
  advanceStopwatchPhase();
}
function adjustStopwatchTime(deltaSec){
  const t = timerState;
  if (t.phase==='setup' || t.phase==='done') return;
  if (t.running){
    timerState = {...t, endsAt: Math.max(Date.now(), t.endsAt + deltaSec*1000)};
  } else {
    timerState = {...t, remainingMs: Math.max(0, t.remainingMs + deltaSec*1000)};
  }
  render();
}
function addFoul(color){
  const cat = currentCat(); if (!cat || !cat.live) return;
  const field = color==='red' ? 'warningsRed' : 'warningsBlue';
  const scoreField = color==='red' ? 'scoreRed' : 'scoreBlue';
  const label = color==='red' ? cat.live.fighterA.name : cat.live.fighterB.name;
  let live = {...cat.live};
  const count = (live[field]||0) + 1;
  live[field] = count;
  if (count === 2 || count === 3){
    live[scoreField] = Math.max(0, live[scoreField] - 1);
    live = pushLiveLog(live, `Advertencia ${count}/4 a ${label} - menos 1 punto`);
  } else if (count >= 4){
    live = pushLiveLog(live, `4ta advertencia a ${label} - descalificación`);
  } else {
    live = pushLiveLog(live, `Advertencia ${count}/4 a ${label}`);
  }
  putCategory(cat.id, {...cat, live});
  if (count >= 4){
    const winnerSide = color==='red' ? 'B' : 'A';
    finalizeLive(cat.id, winnerSide, 'DISQ');
  }
}
function undoFoul(color){
  const cat = currentCat(); if (!cat || !cat.live) return;
  const field = color==='red' ? 'warningsRed' : 'warningsBlue';
  const scoreField = color==='red' ? 'scoreRed' : 'scoreBlue';
  let live = {...cat.live};
  const prev = live[field]||0;
  if (prev<=0) return;
  live[field] = prev-1;
  if (prev===2 || prev===3) live[scoreField] = (live[scoreField]||0) + 1;
  putCategory(cat.id, {...cat, live});
}
function resetLiveScores(){
  jefeUpdate(live=>pushLiveLog({...live, scoreRed:0, scoreBlue:0, warningsRed:0, warningsBlue:0, suddenDeath:false, tiedFinal:false,
    perJudge:{1:{red:0,blue:0},2:{red:0,blue:0},3:{red:0,blue:0},4:{red:0,blue:0}}, pendingVotes:{}}, '- Marcador reiniciado -'));
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* PF = combate continuo se detiene, jueces marcan técnica por técnica (mayoría).
   LC/KL = combate continuo sin pausas, cada juez suma su propio marcador. */
const MODALIDAD_LABELS = { PF:'Point Fighting', LC:'Light Contact', KL:'Kick Light' };
function modalidadLabel(m){ return MODALIDAD_LABELS[m] || m; }
/* Version simplificada de los datos de la categoria SOLO para la Pantalla
   Publica: en vez de la fila de 7 badges chicos que usa Mesa (utiles para
   quien administra, pero se ven amontonados y "genericos" en una TV frente
   al publico), una sola linea de texto mas grande y prolija con lo que
   realmente le importa a quien mira: tatami, modalidad, division, sexo. */
function tvSubtitle(cat){
  const parts = [cat.tatami||'Tatami 1', modalidadLabel(cat.modalidad), divisionLabel(cat.divisionEdad), cat.sexo==='F'?'Femenino':'Masculino'];
  if (cat.peso) parts.push(cat.peso);
  return parts.map(p=>escapeHtml(p)).join(' <span class="tvsub-dot">&middot;</span> ');
}
function catBadges(cat){
  return `<span class="badge tatami">${escapeHtml(cat.tatami||'Tatami 1')}</span>`+
    `<span class="badge ${cat.modalidad==='PF'?'pf':'lc'}">${modalidadLabel(cat.modalidad)}</span>`+
    `<span class="badge">${escapeHtml(divisionLabel(cat.divisionEdad))}</span>`+
    `<span class="badge">${cat.sexo==='F'?'Femenino':'Masculino'}</span>`+
    (cat.peso?`<span class="badge">${escapeHtml(cat.peso)}</span>`:'')+
    `<span class="badge">${cat.cinturon==='negro'?'Cinturón Negro':'Cinturón Color'}</span>`+
    `<span class="badge">${cat.numRounds}x${fmtTime(cat.roundDuration*1000)}</span>`+
    `<span class="badge ${cat.bracketClosed?'closed':'open'}">${cat.bracketClosed?'Llave cerrada':'Inscripciones abiertas'}</span>`;
}
function warnDots(n){ let h=''; for(let i=1;i<=4;i++) h+=`<span class="warndot ${i<=n?'on':''}"></span>`; return h; }
/* Agrupa una lista de categorias por tatami/cancha, para que con varios
   tatamis corriendo a la vez cada jefe de mesa/juez encuentre el suyo rapido
   sin tener que leer el nombre completo de cada categoria una por una. */
function groupByTatami(cats){
  const groups = {};
  cats.forEach(c => { const t = c.tatami || 'Tatami 1'; (groups[t] = groups[t]||[]).push(c); });
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'es',{numeric:true})).map(t => ({tatami:t, cats:groups[t]}));
}
function renderTatamiGroups(cats, itemFn){
  return groupByTatami(cats).map(g =>
    `<div class="tatamihead">${escapeHtml(g.tatami)}</div>${g.cats.map(itemFn).join('')}`
  ).join('');
}
function perJudgeBreakdown(live){
  if (live.mode === 'PF') return '';
  const n = live.numJudges || 3;
  const items = [];
  for (let i=1;i<=n;i++){
    const j = (live.perJudge && live.perJudge[i]) || {red:0,blue:0};
    items.push(`<span>J${i} <b>${j.red}-${j.blue}</b></span>`);
  }
  return `<div class="pjrow">${items.join('')}</div>`;
}

/* ------------------------------------ render ------------------------------------ */
function belt(){ return `<div class="belt"><div class="b-y"></div><div class="b-g"></div><div class="b-b"></div><div class="b-r"></div><div class="b-k"></div></div>`; }
function render(){
  if (state.loading){ root.innerHTML=''; return; }
  /* Cada actualizacion automatica (sync con Firebase) reconstruye toda la
     pantalla, lo que crea un contenedor .scroll nuevo desde cero. Sin este
     rescate, cualquiera que estuviera bajando con el dedo/mouse quedaba
     tironeado de vuelta arriba cada vez que llegaba una actualizacion. */
  const prevScroll = document.querySelector('.scroll');
  const scrollTop = prevScroll ? prevScroll.scrollTop : 0;
  const fns = {
    home:renderHome, mesa_home:renderMesaHome, mesa_newCategory:renderNewCategory, mesa_category:renderMesaCategory,
    mesa_certificate:renderCertificado,
    judge_selectCategory:renderJudgeSelectCategory, judge_selectSlot:renderJudgeSelectSlot, judge_vote:renderJudgeVote,
    jefe_selectCategory:renderJefeSelectCategory, jefe_control:renderJefeControl,
    display_selectCategory:renderDisplaySelectCategory, display_view:renderDisplayView,
    stopwatch:renderStopwatch, quick_start:renderQuickStart,
  };
  (fns[state.view]||renderHome)();
  if (scrollTop){
    const newScroll = document.querySelector('.scroll');
    if (newScroll) newScroll.scrollTop = scrollTop;
  }
}
/* Usada por el tick de 300ms y por cada sincronizacion con Firebase mientras
   se esta en Jefe de Mesa: en vez de reconstruir toda la pantalla (lo que
   podia "comerse" un toque en +1 punto si caia justo en ese instante),
   solo refresca el numero del cronometro. Los puntos/faltas de esta pantalla
   siempre se originan en este mismo dispositivo (el Jefe de Mesa es quien
   los carga), asi que no hace falta reconstruir todo para verlos - ya se
   actualizan solos apenas se tocan, porque esas acciones llaman a render()
   directamente. */
function renderOrTick(){
  if (state.view === 'jefe_control'){
    const cat = currentCat();
    const t = cat && cat.live && document.querySelector('.jefecontrol .timer .t');
    if (t){
      const remaining = getRemainingMs(cat.live);
      t.textContent = fmtTime(remaining);
      const ringEl = document.querySelector('.jefecontrol .timerring circle + circle');
      if (ringEl){
        const phaseMax = cat.live.suddenDeath ? 60000 : cat.live.roundDuration*1000;
        ringEl.setAttribute('stroke-dashoffset', timerRingAttrs(remaining, phaseMax).offset);
      }
      return;
    }
  }
  render();
}

/* Fila "Rojo vs Azul" compartida entre la vista de mesa y la pantalla pública -
   mismo lenguaje visual (colores de esquina) que el marcador en vivo. */
function matchupHtml(fA, fB, winnerSide, vsLabel){
  const side = (f, isWinner, sideClass, corner) => f
    ? `<div class="mfighter ${sideClass}"><span class="corner">${corner}</span><span class="fname ${isWinner?'win':''}">${escapeHtml(f.name)}</span></div>`
    : `<div class="mfighter ${sideClass}"><span class="fname dim">-</span></div>`;
  return `<div class="matchup">${side(fA, winnerSide==='A', 'side-a', 'Rojo')}<div class="matchvs">${vsLabel}</div>${side(fB, winnerSide==='B', 'side-b', 'Azul')}</div>`;
}
function renderMatchCard(cat, m){
  if (m.status==='empty') return '';
  let body = '';
  if (m.status==='bye'){
    body = `${matchupHtml(m.A, m.B, 'A', 'BYE')}
      <div class="matchstatus">${escapeHtml((m.winner||{}).name||'')} avanza automáticamente</div>`;
  } else if (m.status==='waiting'){
    body = `<div class="matchstatus">Esperando resultado de la ronda anterior</div>`;
  } else if (m.status==='pending'){
    body = `${matchupHtml(m.A, m.B, null, 'VS')}
      <div class="matchactions">
        <button class="btn-sm" onclick="declareWinner('${cat.id}','${m.id}','A')">Gana ${escapeHtml(m.A.name)}</button>
        <button class="btn-sm" onclick="declareWinner('${cat.id}','${m.id}','B')">Gana ${escapeHtml(m.B.name)}</button>
        <button class="btn-sm on" onclick="startLive('${cat.id}','${m.id}')">Anotar en vivo</button>
      </div>`;
  } else if (m.status==='live'){
    const live = cat.live;
    body = `${matchupHtml(m.A, m.B, null, 'EN VIVO')}
      <div class="matchstatus">En vivo - asalto ${live?live.round:1}/${live?live.roundsTotal:1} - marcador ${live?live.scoreRed:0}-${live?live.scoreBlue:0}</div>
      <div class="matchactions"><button class="btn-sm on" onclick="goTo('jefe_control',{catId:'${cat.id}'})">Ir a control de mesa</button><button class="btn-sm warn" onclick="resetLiveScoresFromMesa('${cat.id}')">Reiniciar marcador</button></div>`;
  } else if (m.status==='done'){
    body = `${matchupHtml(m.A, m.B, m.winnerSide, 'VS')}
      <div class="matchstatus">${escapeHtml(m.winner.name)} gana${m.disq?' (descalificación)':m.manual?' (decisión manual)':` ${m.scoreA}-${m.scoreB}`}</div>`;
  }
  return `<div class="matchcard">${body}</div>`;
}

/* Arbol de llave con lineas conectoras (Octavos->Cuartos->Semis->Final) para la
   pantalla publica, imitando el papel/impreso de un bracket real. El 3° y 4°
   puesto se define con las perdedoras de semis y no encaja en esa linea recta,
   asi que se muestra aparte, abajo. Usa nodos de altura fija para que el
   espaciado automatico (justify-content:space-around) alinee cada nodo con el
   punto medio entre sus dos "padres" de la ronda anterior. */
function renderBracketTree(rounds){
  const byName = {}; rounds.forEach(r=>{ byName[r.name]=r; });
  const mainRounds = [byName['Octavos'], byName['Cuartos'], byName['Semis'], byName['Final']];
  const thirdPlace = byName['3° y 4° puesto'];
  const cols = mainRounds.map((r, ri) => {
    const isLast = ri === mainRounds.length - 1;
    const nodes = r.matches.map((m, mi) => {
      const connectClass = isLast ? '' : 'connect';
      const pairClass = r.matches.length>1 ? (mi%2===0?'pair-top':'pair-bottom') : '';
      if (m.status==='empty' || m.status==='waiting'){
        return `<div class="bnode ${connectClass} ${pairClass}"><div class="matchcard bnode-empty"><div class="matchstatus" style="margin:0;">${m.status==='waiting'?'Por definir':'-'}</div></div></div>`;
      }
      const vsLabel = m.status==='bye' ? 'BYE' : (m.status==='live' ? 'EN VIVO' : 'VS');
      return `<div class="bnode ${connectClass} ${pairClass}"><div class="matchcard">${matchupHtml(m.A, m.B, m.winnerSide||null, vsLabel)}</div></div>`;
    }).join('');
    return `<div class="bcol"><div class="bcoltitle">${r.name}</div><div class="bnodes">${nodes}</div></div>`;
  }).join('');
  const tp = thirdPlace.matches[0];
  const tpCard = (tp.status==='empty'||tp.status==='waiting')
    ? `<div class="matchcard"><div class="matchstatus" style="margin:0;">${tp.status==='waiting'?'Se define con las perdedoras de semis':'-'}</div></div>`
    : `<div class="matchcard">${matchupHtml(tp.A, tp.B, tp.winnerSide||null, tp.status==='bye'?'BYE':(tp.status==='live'?'EN VIVO':'VS'))}</div>`;
  return `<div class="bracket-wrap">${cols}</div>
    <div class="roundblock"><h3>3&deg; y 4&deg; puesto</h3>${tpCard}</div>`;
}
function renderMatchCardDisplay(m){
  if (m.status==='empty') return '';
  if (m.status==='waiting') return `<div class="matchcard"><div class="matchstatus">Por definir</div></div>`;
  if (m.status==='bye') return `<div class="matchcard">${matchupHtml(m.A, m.B, 'A', 'BYE')}<div class="matchstatus">Avanza directo</div></div>`;
  if (m.status==='live') return `<div class="matchcard">${matchupHtml(m.A, m.B, null, 'EN VIVO')}</div>`;
  if (m.status==='pending') return `<div class="matchcard">${matchupHtml(m.A, m.B, null, 'VS')}</div>`;
  return `<div class="matchcard">${matchupHtml(m.A, m.B, m.winnerSide, 'VS')}</div>`;
}
